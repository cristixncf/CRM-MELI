function renderProductos(){
  const ventas = getVentasFiltradas();
  if(!ventas.length){
    if(!state.ventas.length) return emptyState();
    return `<div class="empty-state">
      <div class="empty-icon">🗓️</div>
      <h3>Sin ventas en el período filtrado</h3>
      <p>Ajusta el filtro global de fechas en la barra superior o límpialo.</p>
      <button class="btn btn-ghost" data-action="global-clear">Ver todo el histórico</button>
    </div>`;
  }

  const byS = {};
  for(const r of ventas){
    if(!r.sku) continue;
    if(!byS[r.sku]) byS[r.sku] = {
      sku: r.sku, marca: r.marca, und: 0, pedidos: new Set(),
      clientes: new Set(), bruto: 0, neto: 0, ultima: ''
    };
    const p = byS[r.sku];
    p.und += parseNum(r.und);
    if(r.noPed) p.pedidos.add(r.noPed);
    if(r.codCliente) p.clientes.add(r.codCliente);
    p.bruto += parseNum(r.valor);
    p.neto += parseNum(r.precioFinal);
    if(r.fecha && r.fecha > p.ultima) p.ultima = r.fecha;
  }

  const search = ui.productosSearch.toLowerCase();
  const products = Object.values(byS).filter(p => {
    if(ui.productosBrand && p.marca !== ui.productosBrand) return false;
    if(search){
      const name = getSkuName(p.sku).toLowerCase();
      if(!p.sku.toLowerCase().includes(search) && !name.includes(search)) return false;
    }
    return true;
  }).sort((a,b) => b.neto - a.neto);

  let html = `<div class="view-head">
    <h2>Productos · ${fmtNum(products.length)}</h2>
    <div class="filters">
      <input type="text" placeholder="Buscar SKU o nombre…" value="${escapeHTML(ui.productosSearch)}" data-filter="productos-search">
      <select data-filter="productos-brand">
        <option value="">Todas las marcas</option>
        ${BRAND_ORDER.map(b => `<option value="${b}" ${ui.productosBrand === b ? 'selected' : ''}>${b}</option>`).join('')}
      </select>
    </div>
  </div>`;

  html += `<div class="table-wrap"><table class="data-table">
    <thead><tr>
      <th>SKU</th><th>Marca</th><th class="num">Unidades</th><th class="num">Pedidos</th>
      <th class="num">Clientes</th><th class="num">Venta bruta</th><th class="num">Venta neta</th><th>Última venta</th>
    </tr></thead><tbody>`;

  if(!products.length) html += `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--dim)">Sin productos que coincidan</td></tr>`;

  for(const p of products){
    const bc = BRAND_COLORS[p.marca] || '#8B9099';
    const name = getSkuName(p.sku);
    html += `<tr>
      <td>
        <code class="sku" title="${escapeHTML(name)}">${escapeHTML(p.sku)}</code>
        ${name ? `<div class="sku-name">${escapeHTML(name)}</div>` : ''}
      </td>
      <td><span class="brand-badge" style="color:${bc};background:${alpha(bc,.13)};border-color:${alpha(bc,.3)}">${escapeHTML(p.marca)}</span></td>
      <td class="num">${fmtNum(p.und)}</td>
      <td class="num">${fmtNum(p.pedidos.size)}</td>
      <td class="num">${fmtNum(p.clientes.size)}</td>
      <td class="num">${fmtCOP(p.bruto)}</td>
      <td class="num strong">${fmtCOP(p.neto)}</td>
      <td>${formatDateCO(p.ultima)}</td>
    </tr>`;
  }
  html += `</tbody></table></div>`;
  return html;
}

/* ===================== RENDER: REPORTES ===================== */
function renderReportes(){
  const ventas = getVentasFiltradas();
  if(!ventas.length){
    if(!state.ventas.length) return emptyState();
    return `<div class="empty-state">
      <div class="empty-icon">🗓️</div>
      <h3>Sin ventas en el período filtrado</h3>
      <p>Ajusta el filtro global de fechas en la barra superior o límpialo.</p>
      <button class="btn btn-ghost" data-action="global-clear">Ver todo el histórico</button>
    </div>`;
  }

  const mix = {};
  let totalMix = 0;
  for(const r of ventas){
    const b = r.marca || 'OTROS';
    mix[b] = (mix[b] || 0) + parseNum(r.precioFinal);
    totalMix += parseNum(r.precioFinal);
  }

  const mixData = ['TOTAL','DCK','FORCE','JASIC','AIR FORCE'].map(b => {
    const val = mix[b] || 0;
    const pct = totalMix > 0 ? val/totalMix*100 : 0;
    const goal = BRAND_GOALS[b] || 0;
    return { brand:b, pct, goal, gap: pct - goal, color: BRAND_COLORS[b] };
  });

  let html = `<div class="panel" style="margin-bottom:16px">
    <h3 class="panel-title">Mix actual vs meta 2026-2027</h3>
    <table class="mix-table"><thead><tr>
      <th>Marca</th><th>Actual</th><th>Meta</th><th>Brecha</th><th style="width:180px">Mix</th>
    </tr></thead><tbody>`;
  for(const d of mixData){
    const gapClass = d.gap >= 0 ? 'delta-up' : 'delta-down';
    const gapIcon = d.gap >= 0 ? '▲' : '▼';
    html += `<tr>
      <td><span class="brand-badge" style="color:${d.color};background:${alpha(d.color,.13)};border-color:${alpha(d.color,.3)}">${d.brand}</span></td>
      <td><b>${d.pct.toFixed(1)}%</b></td>
      <td style="color:var(--dim)">${d.goal}%</td>
      <td class="${gapClass}">${gapIcon} ${Math.abs(d.gap).toFixed(1)} pp</td>
      <td><div class="mix-bar"><div class="mix-bar-fill" style="width:${Math.min(100,d.pct).toFixed(1)}%;background:${d.color}"></div></div></td>
    </tr>`;
  }
  html += `</tbody></table></div>`;

  const monthly = {};
  for(const r of ventas){
    if(!r.fecha) continue;
    const m = r.fecha.slice(0,7);
    monthly[m] = (monthly[m] || 0) + parseNum(r.precioBI);
  }
  const monthlyArr = Object.entries(monthly).sort((a,b) => a[0].localeCompare(b[0]));
  html += `<div class="panel" style="margin-bottom:16px">
    <h3 class="panel-title">Evolución mensual · Precio B/I</h3>
    ${renderMonthlyChart(monthlyArr)}
  </div>`;

  const depto = {};
  for(const r of ventas){
    const d = r.depto || '—';
    depto[d] = (depto[d] || 0) + parseNum(r.precioFinal);
  }
  const deptoArr = Object.entries(depto).map(([d,v]) => ({depto:d, neto:v}))
    .sort((a,b) => b.neto - a.neto).slice(0,10);
  const maxDepto = Math.max(...deptoArr.map(d => d.neto), 1);

  html += `<div class="chart-grid">
    <div class="panel"><h3 class="panel-title">Top 10 departamentos</h3><div class="bar-chart">`;
  for(const d of deptoArr){
    html += `<div class="bar-row">
      <div class="bar-label">${escapeHTML(d.depto)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(d.neto/maxDepto*100).toFixed(1)}%;background:var(--teal)"></div></div>
      <div class="bar-value">${fmtCOP(d.neto)}</div>
    </div>`;
  }
  html += `</div></div>`;

  const fin = {};
  for(const r of ventas){
    const b = r.marca || 'OTROS';
    if(!fin[b]) fin[b] = { pedidos:new Set(), clientes:new Set(), und:0, bruto:0, neto:0 };
    const f = fin[b];
    if(r.noPed || r.factura) f.pedidos.add(r.noPed || r.factura);
    if(r.codCliente) f.clientes.add(r.codCliente);
    f.und += parseNum(r.und);
    f.bruto += parseNum(r.valor);
    f.neto += parseNum(r.precioFinal);
  }
  html += `<div class="panel"><h3 class="panel-title">Detalle financiero por marca</h3>
    <div class="table-wrap" style="border:none"><table class="data-table" style="min-width:0">
    <thead><tr>
      <th>Marca</th><th class="num">Pedidos</th><th class="num">Clientes</th><th class="num">Und</th>
      <th class="num">Bruto</th><th class="num">Neto</th><th class="num">% Neto</th>
    </tr></thead><tbody>`;
  const finArr = Object.entries(fin).sort((a,b) => b[1].neto - a[1].neto);
  for(const [b, f] of finArr){
    const bc = BRAND_COLORS[b] || '#8B9099';
    const pct = totalMix > 0 ? f.neto/totalMix*100 : 0;
    html += `<tr>
      <td><span class="brand-badge" style="color:${bc};background:${alpha(bc,.13)};border-color:${alpha(bc,.3)}">${escapeHTML(b)}</span></td>
      <td class="num">${fmtNum(f.pedidos.size)}</td>
      <td class="num">${fmtNum(f.clientes.size)}</td>
      <td class="num">${fmtNum(f.und)}</td>
      <td class="num">${fmtCOP(f.bruto)}</td>
      <td class="num strong">${fmtCOP(f.neto)}</td>
      <td class="num">${pct.toFixed(1)}%</td>
    </tr>`;
  }
  html += `</tbody></table></div></div></div>`;

  return html;
}

/* ===================== MELI CAPRIS LOGIC ===================== */
function meliDestroyCharts(){
  for(const k in meliState.charts){
    if(meliState.charts[k]) { try { meliState.charts[k].destroy(); } catch(e){} }
  }
  meliState.charts = {};
}
function meliCreateChart(id, config){
  const el = document.getElementById(id);
  if(!el) return;
  if(meliState.charts[id]){ try { meliState.charts[id].destroy(); } catch(e){} }
  meliState.charts[id] = new Chart(el.getContext('2d'), config);
}

function meliGetColorMarca(marca){
  return BRAND_COLORS[marca] || '#8B9099';
}

async function initMeliCapris(){
  try { await loadChartJS(); } catch(e){
    toast('No se pudo cargar Chart.js: ' + e.message, 'error');
    return;
  }

  const marcas = [...new Set(meliState.data.map(d => d.marca))].sort();
  const deptos = [...new Set(meliState.data.map(d => d.departamento))].sort();
  const selMarca = document.getElementById('meliFiltroMarca');
  const selDepto = document.getElementById('meliFiltroDepto');
  if(selMarca) selMarca.innerHTML = '<option value="TODAS">Todas</option>' + marcas.map(m => `<option value="${escapeHTML(m)}">${escapeHTML(m)}</option>`).join('');
  if(selDepto) selDepto.innerHTML = '<option value="TODOS">Todos</option>' + deptos.map(d => `<option value="${escapeHTML(d)}">${escapeHTML(d)}</option>`).join('');

  const btnFiltros = document.getElementById('meliBtnAplicarFiltros');
  const btnPareto = document.getElementById('meliBtnCalcularPareto');
  const btnBodega = document.getElementById('meliBtnCalcularBodega');

  if(btnFiltros) btnFiltros.addEventListener('click', meliAplicarFiltros);
  if(btnPareto) btnPareto.addEventListener('click', meliCalcularPareto);
  if(btnBodega) btnBodega.addEventListener('click', meliCalcularRecomendacion);

  meliActualizarDashboard();
  meliCalcularPareto();
  meliCalcularRecomendacion();
}

function meliAplicarFiltros(){
  const marca = document.getElementById('meliFiltroMarca').value;
  const depto = document.getElementById('meliFiltroDepto').value;
  const full = document.getElementById('meliFiltroFull').value;
  const skuBusqueda = document.getElementById('meliFiltroSKU').value.toLowerCase().trim();

  meliState.filtered = meliState.data.filter(d => {
    if(marca !== 'TODAS' && d.marca !== marca) return false;
    if(depto !== 'TODOS' && d.departamento !== depto) return false;
    if(full !== 'TODOS' && d.full !== full) return false;
    if(skuBusqueda && !d.sku.toLowerCase().includes(skuBusqueda)) return false;
    return true;
  });

  meliActualizarDashboard();
  meliCalcularPareto();
  meliCalcularRecomendacion();
}

function meliActualizarDashboard(){
  const data = meliState.filtered;
  const total = data.length;
  const totalUnidades = data.reduce((s, d) => s + d.unidades, 0);
  const totalValor = data.reduce((s, d) => s + d.valor, 0);
  const totalTicket = total > 0 ? totalValor / total : 0;

  document.getElementById('meliKpiSku').textContent = new Set(data.map(d => d.sku)).size;
  document.getElementById('meliKpiUnidades').textContent = totalUnidades.toLocaleString('es-CO');
  document.getElementById('meliKpiVentas').textContent = '$ ' + totalValor.toLocaleString('es-CO', { minimumFractionDigits: 0 });
  document.getElementById('meliKpiTicket').textContent = '$ ' + totalTicket.toLocaleString('es-CO', { minimumFractionDigits: 0 });

  meliRenderizarTabla();
  meliRenderizarTendencia();
  meliRenderizarTopSKU();
  meliRenderizarDepartamento();
  meliRenderizarMarca();
}

function meliRenderizarTabla(){

function meliCalcularPareto(){
  const metrica = document.getElementById('meliParetoMetrica').value;
  if(meliState.filtered.length === 0){
    document.getElementById('meliPareto80SkuCount').textContent = '0';
    document.getElementById('meliPareto20SkuCount').textContent = '0';
    document.getElementById('meliParetoTotalSku').textContent = '0';
    document.getElementById('meliCuerpoPareto').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#888">Sin datos</td></tr>';
    return;
  }

  const agrupado = {};
  meliState.filtered.forEach(d => {
    if(!agrupado[d.sku]){
      agrupado[d.sku] = {
        sku: d.sku,
        descripcion: d.descripcion || d.sku,
        unidades: 0,
        valor: 0
      };
    }
    agrupado[d.sku].unidades += d.unidades;
    agrupado[d.sku].valor += d.valor;
  });

  const sorted = Object.values(agrupado).sort((a, b) => {
    return metrica === 'unidades' ? b.unidades - a.unidades : b.valor - a.valor;
  });

  const totalMetrica = sorted.reduce((sum, item) => sum + (metrica === 'unidades' ? item.unidades : item.valor), 0);
  let acumulado = 0;
  let corte80 = 0;
  const datosPareto = sorted.map((item, index) => {
    const valor = metrica === 'unidades' ? item.unidades : item.valor;
    acumulado += valor;
    const porcentaje = totalMetrica > 0 ? (acumulado / totalMetrica) * 100 : 0;
    if(porcentaje <= 80) corte80 = index + 1;
    return { ...item, valorMetrica: valor, porcentajeAcumulado: porcentaje };
  });
  if(corte80 === 0) corte80 = sorted.length;

  document.getElementById('meliPareto80SkuCount').textContent = corte80;
  document.getElementById('meliPareto20SkuCount').textContent = sorted.length - corte80;
  document.getElementById('meliParetoTotalSku').textContent = sorted.length;

  const tbody = document.getElementById('meliCuerpoPareto');
  tbody.innerHTML = '';
  datosPareto.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td><strong>${escapeHTML(item.sku)}</strong></td>
      <td>${escapeHTML(item.descripcion)}</td>
      <td>${item.unidades}</td>
      <td>$${item.valor.toLocaleString('es-CO')}</td>
      <td>${item.porcentajeAcumulado.toFixed(1)}%</td>
    `;
    tbody.appendChild(tr);
  });

  const labels = datosPareto.map(d => d.sku);
  const barras = datosPareto.map(d => d.valorMetrica);
  const linea = datosPareto.map(d => d.porcentajeAcumulado);

  meliCreateChart('meliChartPareto', {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {
          label: metrica === 'unidades' ? 'Unidades' : 'Valor ($)',
          data: barras,
          backgroundColor: '#4A90E2',
          order: 1,
          yAxisID: 'y'
        },
        {
          label: '% Acumulado',
          data: linea,
          type: 'line',
          borderColor: '#E53935',
          backgroundColor: 'rgba(229, 57, 53, 0.1)',
          tension: 0.3,
          pointRadius: 2,
          fill: true,
          order: 0,
          yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { color: '#8B9099' } },
        tooltip: {
          callbacks: {
            label: function(context) {
              const label = context.dataset.label || '';
              const val = context.raw;
              if(context.datasetIndex === 1) return label + ': ' + val.toFixed(1) + '%';
              return label + ': ' + val.toLocaleString('es-CO');
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: '#8B9099', maxRotation: 60 } },
        y: {
          beginAtZero: true,
          position: 'left',
          ticks: { color: '#8B9099' },
          title: { display: true, text: metrica === 'unidades' ? 'Unidades' : 'Valor ($)', color: '#8B9099' }
        },
        y1: {
          beginAtZero: true,
          position: 'right',
          max: 100,
          grid: { drawOnChartArea: false },
          ticks: { color: '#8B9099' },
          title: { display: true, text: '% Acumulado', color: '#8B9099' }
        }
      }
    }
  });
}

function meliCalcularRecomendacion(){
  const target = parseInt(document.getElementById('meliInputUnidadesBodega').value) || 500;
  const diasCobertura = parseInt(document.getElementById('meliInputDiasCobertura').value) || 60;
  const maxDiasEntreVentas = parseInt(document.getElementById('meliInputMaxDiasEntreVentas').value) || 30;
  const criterio = document.getElementById('meliBodegaCriterio').value;
  const minSKU = parseInt(document.getElementById('meliInputMinSKU').value) || 20;

  const tbody = document.getElementById('meliCuerpoRecomendacion');
  const vacia = document.getElementById('meliRecomendacionVacia');

  if(meliState.filtered.length === 0){
    if(vacia) vacia.style.display = 'block';
    if(tbody) tbody.innerHTML = '';
    document.getElementById('meliRecSkuCount').textContent = '0';
    document.getElementById('meliRecTotalUnits').textContent = '0';
    document.getElementById('meliRecTotalValue').textContent = '$ 0';
    return;
  }

  const fechas = meliState.filtered.map(d => new Date(d.fecha)).filter(d => !isNaN(d.getTime()));
  if(fechas.length === 0){
    if(vacia) vacia.style.display = 'block';
    if(tbody) tbody.innerHTML = '';
    return;
  }
  const minDate = new Date(Math.min(...fechas));
  const maxDate = new Date(Math.max(...fechas));
  const diffTime = Math.abs(maxDate - minDate);
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

  const agrupado = {};
  meliState.filtered.forEach(d => {
    if(!agrupado[d.sku]){
      agrupado[d.sku] = {
        sku: d.sku,
        descripcion: d.descripcion || d.sku,
        unidades: 0,
        valor: 0,
        dias: new Set(),
        fechas: []
      };
    }
    agrupado[d.sku].unidades += d.unidades;
    agrupado[d.sku].valor += d.valor;
    if(d.fecha){
      agrupado[d.sku].dias.add(d.fecha);
      agrupado[d.sku].fechas.push(new Date(d.fecha));
    }
  });

  let items = Object.values(agrupado).map(item => {
    const diasConVentas = item.dias.size;
    const promedioDiario = diasConVentas > 0 ? item.unidades / diasConVentas : 0;
    const valorPromedioDiario = diasConVentas > 0 ? item.valor / diasConVentas : 0;

    const fechasOrdenadas = item.fechas.sort((a, b) => a - b);
    let totalDiasEntre = 0;
    let conteo = 0;
    for(let i = 1; i < fechasOrdenadas.length; i++){
      const diff = (fechasOrdenadas[i] - fechasOrdenadas[i-1]) / (1000 * 60 * 60 * 24);
      totalDiasEntre += diff;
      conteo++;
    }
    const diasEntreVentas = conteo > 0 ? totalDiasEntre / conteo : Infinity;

    return {
      ...item,
      promedioDiario,
      valorPromedioDiario,
      diasEntreVentas,
      frecuencia: diasConVentas / diffDays
    };
  });

  items = items.filter(item => item.diasEntreVentas <= maxDiasEntreVentas && item.diasEntreVentas > 0 && isFinite(item.diasEntreVentas));

  if(items.length === 0){
    if(vacia) vacia.style.display = 'block';
    if(tbody) tbody.innerHTML = '';
    document.getElementById('meliRecSkuCount').textContent = '0';
    document.getElementById('meliRecTotalUnits').textContent = '0';
    document.getElementById('meliRecTotalValue').textContent = '$ 0';
    return;
  }

  items.sort((a, b) => {
    if(criterio === 'valor') return b.valorPromedioDiario - a.valorPromedioDiario;
    if(criterio === 'balanceado'){
      const maxRot = Math.max(...items.map(i => i.frecuencia));
      const maxVal = Math.max(...items.map(i => i.valorPromedioDiario));
      const scoreA = (a.frecuencia / maxRot) * 0.5 + (a.valorPromedioDiario / maxVal) * 0.5;
      const scoreB = (b.frecuencia / maxRot) * 0.5 + (b.valorPromedioDiario / maxVal) * 0.5;
      return scoreB - scoreA;
    }
    return b.promedioDiario - a.promedioDiario;
  });

  const necesidades = items.map(item => {
    const need = Math.round(item.promedioDiario * diasCobertura);
    const maxEnvio = Math.round(item.promedioDiario * diasCobertura * 2);
    return { ...item, need: Math.max(1, Math.min(need, maxEnvio)) };
  });

  const totalNeed = necesidades.reduce((sum, n) => sum + n.need, 0);
  let asignados = [];

  if(totalNeed <= target){
    asignados = necesidades.map(n => ({ ...n, asignado: n.need }));
    let sobrante = target - totalNeed;
    let i = 0;
    while(sobrante > 0 && i < asignados.length){
      asignados[i].asignado += 1;
      sobrante--;
      i = (i + 1) % asignados.length;
    }
  } else {
    const numSKU = Math.min(items.length, minSKU);
    const topItems = necesidades.slice(0, numSKU);
    const totalPeso = topItems.reduce((s, n) => s + n.need, 0);
    let acum = 0;
    asignados = topItems.map(n => {
      let proporcional = Math.round((n.need / totalPeso) * target);
      if(acum + proporcional > target) proporcional = target - acum;
      acum += proporcional;
      return { ...n, asignado: Math.max(1, proporcional) };
    });
    let diff = target - acum;
    if(diff !== 0){
      for(let i = 0; i < Math.abs(diff) && i < asignados.length; i++){
        if(diff > 0) asignados[i].asignado += 1;
        else if(asignados[i].asignado > 1) asignados[i].asignado -= 1;
      }
    }
    asignados = asignados.filter(n => n.asignado > 0);
  }

  asignados.sort((a, b) => b.asignado - a.asignado);

  if(tbody) tbody.innerHTML = '';
  let totalSku = 0, totalUnidadesRec = 0, totalValorRec = 0;

  asignados.forEach((item, index) => {
    totalSku++;
    totalUnidadesRec += item.asignado;
    const valorEstimado = item.valorPromedioDiario * item.asignado;
    totalValorRec += valorEstimado;
    const diasEntre = item.diasEntreVentas === Infinity ? '∞' : item.diasEntreVentas.toFixed(0);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td><strong>${escapeHTML(item.sku)}</strong></td>
      <td>${escapeHTML(item.descripcion)}</td>
      <td>${item.promedioDiario.toFixed(1)}</td>
      <td>${diasEntre}</td>
      <td style="font-weight:700; color:var(--gold);">${item.asignado}</td>
      <td>$${Math.round(valorEstimado).toLocaleString('es-CO')}</td>
    `;
    if(tbody) tbody.appendChild(tr);
  });

  document.getElementById('meliRecSkuCount').textContent = totalSku;
  document.getElementById('meliRecTotalUnits').textContent = totalUnidadesRec.toLocaleString();
  document.getElementById('meliRecTotalValue').textContent = '$ ' + Math.round(totalValorRec).toLocaleString('es-CO');

  if(vacia) vacia.style.display = asignados.length === 0 ? 'block' : 'none';
}

/* ===================== RENDER: DATOS ===================== */
function renderDatos(){
  const uniqueClientes = new Set(state.ventas.map(r => r.codCliente).filter(Boolean)).size;
  const uniqueSkus = new Set(state.ventas.map(r => r.sku).filter(Boolean)).size;

  let html = `<div class="data-grid">
    <div class="stat-block">
      <h3>Estado actual</h3>
      <div class="stat-row"><span>Ventas cargadas</span><b>${fmtNum(state.ventas.length)}</b></div>
      <div class="stat-row"><span>Marcas en catálogo</span><b>${fmtNum(state.marcas.length)}</b></div>
      <div class="stat-row"><span>Clientes únicos</span><b>${fmtNum(uniqueClientes)}</b></div>
      <div class="stat-row"><span>SKUs únicos</span><b>${fmtNum(uniqueSkus)}</b></div>
      <div class="stat-row"><span>Archivo fuente</span><b>${escapeHTML(state.fileName || '—')}</b></div>
      <div class="stat-row"><span>Cargado el</span><b>${state.loadedAt ? new Date(state.loadedAt).toLocaleString('es-CO') : '—'}</b></div>
      <div class="stat-row"><span>Última importación</span><b>${state.lastImport ? new Date(state.lastImport).toLocaleString('es-CO') : '—'}</b></div>
    </div>
    <div class="stat-block">
      <h3>Acciones</h3>
      <div class="stat-actions">
        <button class="btn btn-primary" data-action="download-template">⬇ Descargar plantilla</button>
        <button class="btn btn-ghost" data-action="export-csv" ${!state.ventas.length ? 'disabled style="opacity:.5"' : ''}>⬇ Exportar ventas CSV</button>
        <button class="btn btn-danger" data-action="clear-data" ${!state.ventas.length ? 'disabled style="opacity:.5"' : ''}>🗑 Borrar todos los datos</button>
      </div>
      <div class="storage-note">💾 Los datos se guardan en <code>localStorage</code> clave <code>"${STORAGE_KEY}"</code></div>
    </div>
  </div>`;

  html += `<div class="stat-block">
    <h3>Columnas esperadas</h3>
    <div class="columns-tabs">
      <button class="tab-btn ${ui.datosTab === 'VENTAS' ? 'active' : ''}" data-tab="VENTAS">VENTAS (${VENTAS_HEADERS.length})</button>
      <button class="tab-btn ${ui.datosTab === 'MARCAS' ? 'active' : ''}" data-tab="MARCAS">MARCAS (3)</button>
    </div>
    <div class="columns-list">`;
  if(ui.datosTab === 'VENTAS'){
    for(const h of VENTAS_HEADERS) html += `<span class="col-chip">${escapeHTML(h)}</span>`;
  } else {
    for(const h of ['NA','BRAND','REFE']) html += `<span class="col-chip">${escapeHTML(h)}</span>`;
  }
  html += `</div></div>`;

  return html;
}

/* ===================== MAIN RENDER ===================== */
function render(){
  const titles = {
    import:'Importar Datos', dashboard:'Dashboard', pareto:'Análisis 80/20',
    ventas:'Ventas', clientes:'Clientes', productos:'Productos',
    reportes:'Reportes', melicapris:'MELI CAPRIS · Análisis de SKU',
    datos:'Gestión de Datos'
  };
  document.getElementById('view-title').textContent = titles[ui.view] || '';
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.view === ui.view);
  });
  const badge = document.getElementById('status-badge');
  if(state.ventas.length){
    badge.textContent = `${state.ventas.length.toLocaleString('es-CO')} filas`;
    badge.className = 'status-badge ok';
  } else {
    badge.textContent = 'Sin datos';
    badge.className = 'status-badge empty';
  }

  // Sync global date inputs
  const gf = document.getElementById('globalFrom');
  const gt = document.getElementById('globalTo');
  if(gf) gf.value = ui.globalFrom;
  if(gt) gt.value = ui.globalTo;

  // Destroy meli charts when leaving the view
  if(ui.view !== 'melicapris') meliDestroyCharts();

  const view = document.getElementById('view');
  let content = '';
  switch(ui.view){
    case 'import': content = renderImport(); break;
    case 'dashboard': content = renderDashboard(); break;
    case 'pareto': content = renderPareto(); break;
    case 'ventas': content = renderVentas(); break;
    case 'clientes': content = renderClientes(); break;
    case 'productos': content = renderProductos(); break;
    case 'reportes': content = renderReportes(); break;
    case 'melicapris': content = renderMeliCapris(); break;
    case 'datos': content = renderDatos(); break;
  }
  view.innerHTML = content;
  view.classList.remove('fade');
  void view.offsetWidth;
  view.classList.add('fade');

  attachDynamicListeners();

  if(ui.view === 'melicapris') initMeliCapris();
}

function attachDynamicListeners(){
  const dz = document.getElementById('drop-zone');
  if(dz){
    dz.addEventListener('click', () => document.getElementById('file-input').click());
    dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', async (e) => {
      e.preventDefault();
      dz.classList.remove('dragover');
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) handleFile(f);
    });
  }
}

/* ===================== FILE HANDLER ===================== */
async function handleFile(file){
  try {
    toast('Procesando archivo…');
    const result = await parseFile(file);
    ui.preview = result;
    ui.importMode = state.ventas.length ? 'append' : 'replace';
    ui.view = 'import';
    render();
    toast(`Archivo leído: ${result.validCount} filas válidas`, 'success');
  } catch(err){
    console.error(err);
    toast('Error: ' + err.message, 'error');
  }
}

/* ===================== ACTIONS ===================== */
function confirmImport(){
  const p = ui.preview;
  if(!p) return;
  const now = Date.now();
  if(ui.importMode === 'append' && state.ventas.length){
    const existingKeys = new Set(state.ventas.map(rowKey));
    const add = p.toImport.filter(r => !existingKeys.has(rowKey(r)));
    state.ventas = state.ventas.concat(add);
    if(p.catalog.length){
      const seen = new Set(state.marcas.map(m => (m.REFE||'').toUpperCase()));
      for(const m of p.catalog) if(!seen.has((m.REFE||'').toUpperCase())) state.marcas.push(m);
    }
    toast(`✓ ${add.length} filas agregadas al dataset existente`, 'success');
  } else {
    state.ventas = p.toImport.slice();
    state.marcas = p.catalog.slice();
    toast(`✓ ${state.ventas.length} filas importadas`, 'success');
  }
  state.brandMap = buildBrandMap(state.marcas);
  state.nameMap = buildNameMap(state.marcas);
  state.fileName = p.fileName;
  state.loadedAt = new Date(now).toISOString();
  state.lastImport = new Date(now).toISOString();
  saveState();
  ui.preview = null;
  ui.importMode = 'replace';
  ui.view = state.ventas.length ? 'dashboard' : 'import';
  render();
}

function downloadTemplate(){
  loadSheetJS().then(XLSX => {
    try {
      const wb = XLSX.utils.book_new();
      const marcasData = state.marcas.length
        ? state.marcas.map(m => ({ NA: m.NA || '', BRAND: m.BRAND || '', REFE: m.REFE || '' }))
        : [
          { NA:'TOTAL TOOLS UTG513326 COMBO TALADRO+ESMERILADORA', BRAND:'TOTAL', REFE:'UTG513326' },
          { NA:'DCK KSM03-230 ESMERILADORA ANGULAR 9"', BRAND:'DCK', REFE:'KSM03-230(110V)' },
          { NA:'JASIC ARC200DC SOLDADORA INVERSORA', BRAND:'JASIC', REFE:'ARC200DC (Z262)' }
        ];
      const wsM = XLSX.utils.json_to_sheet(marcasData, { header: ['NA','BRAND','REFE'] });
      XLSX.utils.book_append_sheet(wb, wsM, 'MARCAS');

      const example = {
        'COD':'A1L','FECHA CORTE':'2026-01-05','CORTE':'09:00:00','FECHA':'2026-01-01',
        'COD. CLIENTE':'1020590','NOMBRE CLIENTE':'German Tulio Fernandez','TIPO ID':'CC',
        'NO. ID':'15258730','DIRECCIÓN':'Carrera 89 #92 C-119','DEPARTAMENTO':'Antioquia',
        'ESTADO':'APROBADO','FACTURA':'GX10712','FULL':'SI','NO. PED':'11192','PROD. SKU':'UTG513326',
        'UND':1,'VALOR':131400,'FLETE':7600,'% FLETE':0.0578,'COMISION':22338,'% COMISION':0.17,
        'PRECIO B/I':110420,'RETE IVA (15%)':0,'RETEFUENTE':0,'PRECIO FINAL':101462,'Observaciones':''
      };
      const wsV = XLSX.utils.json_to_sheet([example], { header: VENTAS_HEADERS });
      XLSX.utils.book_append_sheet(wb, wsV, 'VENTAS');

      const date = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, `Plantilla_Ventas_${date}.xlsx`);
      toast('Plantilla descargada', 'success');
    } catch(e){
      toast('Error generando plantilla: ' + e.message, 'error');
    }
  }).catch(err => toast('Error: ' + err.message, 'error'));
}

function exportCSV(){
  if(!state.ventas.length) return;
  const lines = [VENTAS_HEADERS.join(',')];
  for(const r of state.ventas){
    const vals = [
      r.cod, r.fechaCorte, r.corte, r.fecha, r.codCliente, r.nombreCliente,
      r.tipoId, r.noId, r.direccion, r.depto, r.estado, r.factura,
      r.full, r.noPed, r.sku, r.und, r.valor, r.flete, r.pctFlete,
      r.comision, r.pctComision, r.precioBI, r.reteIva, r.reteFuente,
      r.precioFinal, r.observaciones
    ];
    lines.push(vals.map(v => {
      const s = String(v == null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(','));
  }
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Ventas_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV exportado', 'success');
}

function clearAll(){
  if(!confirm('¿Borrar todos los datos cargados? Esta acción no se puede deshacer.')) return;
  state.ventas = [];
  state.marcas = [];
  state.brandMap = {};
  state.nameMap = {};
  state.fileName = '';
  state.loadedAt = null;
  state.lastImport = null;
  try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
  ui.preview = null;
  ui.view = 'import';
  render();
  toast('Datos borrados', 'success');
}

/* ===================== EVENT HANDLING ===================== */
document.getElementById('nav').addEventListener('click', (e) => {
  const item = e.target.closest('.nav-item');
  if(!item) return;
  ui.view = item.dataset.view;
  render();
});

document.getElementById('file-input').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if(f) handleFile(f);
  e.target.value = '';
});

document.getElementById('theme-toggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  document.getElementById('theme-toggle').textContent = next === 'dark' ? '🌙' : '☀️';
});

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if(btn){
    const a = btn.dataset.action;
    if(a === 'go-import'){ ui.view = 'import'; render(); }
    else if(a === 'confirm-import') confirmImport();
    else if(a === 'cancel-import'){ ui.preview = null; render(); }
    else if(a === 'download-template') downloadTemplate();
    else if(a === 'export-csv') exportCSV();
    else if(a === 'clear-data') clearAll();
    else if(a === 'dev-clear'){ ui.devFrom = ''; ui.devTo = ''; updateViewContent(); }
    else if(a === 'global-clear'){ ui.globalFrom = ''; ui.globalTo = ''; render(); }
    else if(a === 'pareto-preset'){
      const p = btn.dataset.preset;
      if(p === 'all'){ ui.paretoFrom = ''; ui.paretoTo = ''; }
      else {
        const today = new Date();
        const iso = today.toISOString().slice(0,10);
        let from = '';
        if(p === '30d') from = new Date(Date.now() - 30*86400000).toISOString().slice(0,10);
        else if(p === '90d') from = new Date(Date.now() - 90*86400000).toISOString().slice(0,10);
        else if(p === 'ytd') from = today.getFullYear() + '-01-01';
        ui.paretoFrom = from;
        ui.paretoTo = iso;
      }
      updateViewContent();
    }
  }
  const pageBtn = e.target.closest('[data-page]');
  if(pageBtn && !pageBtn.disabled){
    const page = +pageBtn.dataset.page;
    const ctx = pageBtn.dataset.ctx;
    if(ctx === 'ventas'){
      ui.ventasPage = page;
      const el = document.getElementById('ventas-content');
      if(el){ el.innerHTML = renderVentasContent(); attachDynamicListeners(); }
      else render();
    }
  }
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){
    ui.datosTab = tabBtn.dataset.tab;
    render();
  }
});

document.addEventListener('input', (e) => {
  const f = e.target.dataset.filter;
  if(!f) return;
  const val = e.target.value;
  if(f === 'ventas-search'){ ui.ventasSearch = val; ui.ventasPage = 1; updateVentasContent(); }
  else if(f === 'clientes-search'){ ui.clientesSearch = val; updateViewContent(); }
  else if(f === 'productos-search'){ ui.productosSearch = val; updateViewContent(); }
});

document.addEventListener('change', (e) => {
  const f = e.target.dataset.filter;
  if(!f) return;
  const val = e.target.value;
  if(f === 'ventas-brand'){ ui.ventasBrand = val; ui.ventasPage = 1; updateVentasContent(); }
  else if(f === 'ventas-depto'){ ui.ventasDepto = val; ui.ventasPage = 1; updateVentasContent(); }
  else if(f === 'ventas-full'){ ui.ventasFull = val; ui.ventasPage = 1; updateVentasContent(); }
  else if(f === 'productos-brand'){ ui.productosBrand = val; updateViewContent(); }
  else if(f === 'pareto-from'){ ui.paretoFrom = val; updateViewContent(); }
  else if(f === 'pareto-to'){   ui.paretoTo   = val; updateViewContent(); }
  else if(f === 'dev-from'){ ui.devFrom = val; updateViewContent(); }
  else if(f === 'dev-to'){   ui.devTo   = val; updateViewContent(); }
  else if(f === 'global-from'){ ui.globalFrom = val; render(); }
  else if(f === 'global-to'){   ui.globalTo   = val; render(); }
  else if(e.target.name === 'import-mode'){ ui.importMode = val; }
});

function updateVentasContent(){
  const el = document.getElementById('ventas-content');
  if(!el) return;
  el.innerHTML = renderVentasContent();
  el.classList.remove('fade');
  void el.offsetWidth;
  el.classList.add('fade');
  attachDynamicListeners();
}

function updateViewContent(){
  const active = document.activeElement;
  const filter = active && active.dataset ? active.dataset.filter : null;
  const selStart = active && active.selectionStart;
  const selEnd = active && active.selectionEnd;
  render();
  if(filter){
    const newEl = document.querySelector(`[data-filter="${filter}"]`);
    if(newEl){
      newEl.focus();
      if(newEl.setSelectionRange && selStart != null) newEl.setSelectionRange(selStart, selEnd);
    }
  }
}

/* ===================== INIT ===================== */
function init(){
  loadState();
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  document.getElementById('theme-toggle').textContent = cur === 'dark' ? '🌙' : '☀️';
  if(state.ventas.length) ui.view = 'dashboard';
  render();
}
init();

})();
</script>
</body>
</html>
